name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting and lint
        run: uv run ruff check --output-format=github . && uv run ruff format --check .

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: uv run coverage run manage.py test && uv run coverage report

      - name: Check the production configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "f!92ci-only-x3dQ-secret-key-7mK-that-is-never-used-outside-tests"
          DJANGO_ALLOWED_HOSTS: "tanu.example.test"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Audit Python dependencies
        run: uv run pip-audit

  container:
    name: Container (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --tag tanu:ci .

      - name: Verify the runtime
        env:
          DJANGO_SECRET_KEY: "f!92ci-only-x3dQ-secret-key-7mK-that-is-never-used-outside-tests"
        run: |
          docker run --rm tanu:ci python --version | grep -E '^Python 3\.14\.'
          docker run --rm \
            --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS=tanu.example.test \
            tanu:ci python manage.py check
