[project]
name = "tanu"
version = "0.1.0"
description = "A self-hostable home for independent stories."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
dependencies = [
  "Django>=5.2.15,<5.3",
  "gunicorn>=23.0.0,<24",
  "psycopg[binary]>=3.2.0,<4",
  "whitenoise>=6.9.0,<7",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10.0,<8",
  "pip-audit>=2.9.0,<3",
  "ruff>=0.12.0,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["core", "users"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
